# Host overlays supply the actual stage, camera and MCU configuration.
schema_version: 1.0
session: aht-holospim
strict: true
mock: true
services:
  transport: pv-access
  laser_service:
    prefix: "HOLOSPIM-AAAOTF:"
    address: "127.0.0.1"
  survey_service:
    plugin_name: redsun-aht
    plugin_id: esp300-stage
    prefix: "HOLOSPIM-SURVEY:"
    args:
      port: "REPLACE_ESP300_SERIAL_PORT"
      prefix: "HOLOSPIM-SURVEY:"
      axis-identities: ["REPLACE_ESP300_X_ID", "REPLACE_ESP300_Y_ID", "REPLACE_ESP300_Z_ID"]
      limits: "REPLACE_SURVEY_LIMITS_UM"
  camera_service:
    plugin_name: redsun-aht
    plugin_id: spinnaker-camera
    prefix: "HOLOSPIM-CAMERA:"
    args:
      serial: "REPLACE_FLIR_SERIAL"
      pixel-format: "REPLACE_FLIR_PIXEL_FORMAT"
      name: camera
  pvcam_service:
    plugin_name: redsun-aht
    plugin_id: mmcore-camera
    prefix: "HOLOSPIM-PVCAM:"
    args:
      mm-config: "REPLACE_PVCAM_MM_CONFIG"
      device: "REPLACE_PVCAM_CAMERA_LABEL"
      defer-initial-frame: true
      name: pvcam
  mcu_service:
    plugin_name: redsun-aht
    plugin_id: unified-mcu
    prefix: "HOLOSPIM-MCU:"
    args:
      port: "REPLACE_MCU_SERIAL_PORT"
      prefix: "HOLOSPIM-MCU:"
devices:
  laser:
    plugin_name: redsun-aht
    plugin_id: aaaotf
    service: laser_service
  survey:
    plugin_name: redsun-aht
    plugin_id: esp300-stage
    service: survey_service
  camera:
    plugin_name: redsun-aht
    plugin_id: spinnaker-camera
    service: camera_service
  pvcam:
    plugin_name: redsun-aht
    plugin_id: mmcore-camera
    service: pvcam_service
  rotation:
    plugin_name: redsun-aht
    plugin_id: unified-rotation
    service: mcu_service
  mcu:
    plugin_name: redsun-aht
    plugin_id: unified-mcu
    service: mcu_service
