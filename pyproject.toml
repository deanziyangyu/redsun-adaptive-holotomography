[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "redsun-adaptive-holotomography"
version = "0.1.0.dev0"
description = "Reusable acquisition and processing components for adaptive holotomography"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "aioca==2.1",
  "bluesky>=1.15,<2",
  "caproto==1.3.0",
  "dependency-injector>=4.48,<5",
  "event-model>=1.24,<2",
  "msgspec>=0.21.1,<0.22",
  "numpy>=2,<3",
  "opencv-python-headless==4.14.0.94",
  "ophyd-async==0.21.2",
  "psygnal>=0.15,<0.16",
  "redsun[epics,zarr]==0.13.0rc0",
  "connected-components-3d>=3.23,<4",
  "scikit-image>=0.25,<0.26",
  "scipy>=1.15,<2",
  "tifffile>=2025.1,<2027",
  "zarr==3.3.0",
]

[dependency-groups]
dev = [
  "mypy>=2.3.0",
  "pre-commit>=4.5.0",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.16.0",
  "types-PyYAML>=6.0.12.20250915",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.10,<4",
]
camera-mmcore = [
  "pymmcore==12.5.0.75.0",
  "pymmcore-plus==0.18.1",
]
stage-esp300 = [
  "pyserial==3.5",
]
gpu-cupy = [
  "cupy-cuda12x==14.2.0",
]
matlab-msbp = [
  "h5py>=3.15,<4",
  "scipy>=1.16,<2",
]
catalog-tiled = [
  "bluesky-tiled-plugins==2.0.7",
  "tiled[server]==0.2.14",
]
pyqt = [
  "napari[pyqt6]>=0.6.6",
  "redsun[pyqt]==0.13.0rc0",
]
pyside = [
  "napari[pyside6]>=0.6.6",
  "redsun[pyside]==0.13.0rc0",
]

[project.scripts]
aht = "redsun_aht.__main__:main"
aht-camera-ioc = "redsun_aht.services.camera_ioc:main"

[project.entry-points."redsun.plugins"]
redsun-aht = "redsun.yaml"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/redsun_aht"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["redsun_aht"]
omit = ["src/redsun_aht/protocols.py"]

[tool.coverage.report]
exclude_lines = [
  "@abstractmethod",
  "if TYPE_CHECKING:",
  "@overload",
  "class .*Protocol",
  "pragma: no cover",
  "raise NotImplementedError",
]
fail_under = 90
show_missing = true

[tool.mypy]
files = ["src", "tests"]
pretty = true
strict = true
warn_no_return = true
warn_unreachable = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "catalog: requires the optional local Tiled catalog runtime",
  "hardware: requires explicitly enabled physical hardware",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D", "TC", "PERF", "RUF"]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.per-file-ignores]
"src/redsun_aht/domain/models.py" = ["D105"]
"src/redsun_aht/protocols.py" = ["D102"]
"tests/*.py" = ["D", "TC"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
