[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "redsun-adaptive-holotomography"
version = "0.1.0.dev0"
description = "Reusable acquisition and processing components for adaptive holotomography"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
# The acquisition application is PVA-only. Channel Access is deliberately absent:
# no aioca, no caproto, no `*-ioc` services.
dependencies = [
  "bluesky>=1.15.1,<2",
  "event-model>=1.24,<2",
  "fastcs[epicspva]>=0.14.4",
  "msgspec>=0.21.1,<0.22",
  "numpy>=2,<3",
  "ophyd-async[pva]==0.21.3",
  "oxiserial==0.4.0",
  "p4p>=4.3.0",
  "psygnal>=0.16.1,<0.17",
  "PyYAML>=6.0.2,<7",
  "redsun[zarr]==0.17.0",
  "tifffile>=2025.1,<2027",
  "tqdm>=4.66,<5",
  "zarr==3.3.0",
]

[dependency-groups]
dev = [
  "mypy>=2.3.0",
  "pre-commit>=4.5.0",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.16.0",
  "types-PyYAML>=6.0.12.20250915",
]

[project.optional-dependencies]
camera-webcam = ["opencv-python-headless==4.11.0.86"]
camera-mmcore = [
  "pymmcore==12.5.0.75.0",
  "pymmcore-plus==0.18.1",
]
pyqt = [
  "matplotlib>=3.8,<4",
  "napari[pyqt6]==0.9.2",
  "superqt>=0.9.0",
  "redsun[pyqt]==0.17.0",
]
pyside = [
  "matplotlib>=3.8,<4",
  "napari[pyside6]==0.9.2",
  "superqt>=0.9.0",
  "redsun[pyside]==0.17.0",
]
all = [
  "redsun-adaptive-holotomography[camera-mmcore,pyqt]",
]

[project.scripts]
aht = "redsun_aht.__main__:main"

[project.entry-points."redsun.plugins"]
redsun-aht = "redsun.yaml"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/scripts/dsh", "/skills", "/AGENTS.md"]
exclude = ["/.archive", "/.venv", "/tmp"]

[tool.hatch.build.targets.wheel]
packages = ["src/redsun_aht"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["redsun_aht"]

[tool.coverage.report]
exclude_lines = [
  "@abstractmethod",
  "if TYPE_CHECKING:",
  "@overload",
  "class .*Protocol",
  "pragma: no cover",
  "raise NotImplementedError",
]
fail_under = 90
show_missing = true

[tool.mypy]
files = ["src", "tests"]
pretty = true
strict = true
warn_no_return = true
warn_unreachable = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "--strict-config --strict-markers -m 'not research and not integration'"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "hardware: requires explicitly enabled physical hardware",
  "integration: exercises a complete application/framework boundary",
  "research: validates exploratory numerical or dataset-analysis tooling",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D", "TC", "PERF", "RUF"]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "TC"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
